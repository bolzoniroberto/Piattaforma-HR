# Backend Express su Fly.io (regione Francoforte: dati HR restano in UE).
# Cambia "app" con il nome scelto in `fly launch --no-deploy`.
app = "piattaforma-hr-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STORAGE_DIR = "/storage"
  TRUST_PROXY_HOPS = "2"

# SQLite su volume: una sola macchina, mai scalare orizzontalmente.
[[mounts]]
  source = "hr_storage"
  destination = "/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
